name: Build - Développement APK (EAS Local + Hot Reload)

on:
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint:check

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build Development APK with EAS Local
        run: eas build --platform android --profile development --local --output=./app-development.apk --non-interactive
        env:
          NODE_ENV: production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: development-apk
          path: ./app-development.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "✅ Development APK built successfully!"
          echo "🔥 Includes Expo Dev Client (hot reload + debugging)"
          echo "📱 This replaces Expo Go app"
          echo ""
          echo "Usage:"
          echo "1. Install the APK on your device"
          echo "2. Run: npx expo start"
          echo "3. Scan the QR code with the app"
          echo "4. Enjoy hot reload! 🚀"
          echo ""
          echo "Download the APK from the workflow artifacts above ⬆️"
