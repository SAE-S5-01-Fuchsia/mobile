name: CI - Test, Lint, and Export

on:
  push:
    branches: [main, develop, feat/**]
  pull_request:
    branches: [main, develop]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint:check

      - name: Run tests
        run: npm test
        continue-on-error: true # Permet de continuer même si pas de tests configurés

      - name: Test bundle export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload export artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: expo-export-bundle
          path: dist/
          retention-days: 2
